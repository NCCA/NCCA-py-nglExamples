




[project]
name = "pyngldemos"
version = "0.2.0"
description = "Demos for PyNGL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.9.2",
    "numpy>=2.3.3",
    "qtpy>=2.4.3",
    "freetype-py>=2.5.1",
    "pysdl3>=0.9.8b9",
    "wgpu",
    "marimo>=0.17.2",
    "matplotlib>=3.10.7",
    "ncca-ngl>=1.0.0",
    "openexr>=3.4.13",
    "impasse>=5.4.2",
    "mujoco>=3.12.0",
]


[tool.uv.workspace]
members=["*"]
exclude=["*"]
[tool.uv.sources]
#used for local development only
# ncca-ngl = [
#  { path = "/Users/jmacey/teaching/Code/PyNGL", editable=true}
#  ]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["PBR/HDRIBaker"]
